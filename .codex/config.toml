#:schema https://developers.openai.com/codex/config-schema.json

# Morph project-scoped Codex configuration.
# Project config overrides the user's ~/.codex/config.toml when this repository is trusted.

model = "gpt-5.6"
model_reasoning_effort = "medium"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
# Keep parallelism bounded to reduce duplicate repository scans, write conflicts, and token usage.
max_concurrent_threads_per_session = 2
