name: CI

on:
  push:
    branches:
      - main
      - feat/theme-storage-abstraction
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The repository currently has a pre-existing package.json / lockfile
      # specifier mismatch for @cloudflare/sandbox (0.12.7 vs ^0.12.7).
      # Keep CI focused on validating the code while that lockfile drift is
      # repaired separately; dependency resolution still uses pnpm-lock.yaml.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
