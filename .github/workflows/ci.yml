name: CI

on:
  # `push` covers the merged state on `main`; `pull_request` covers every branch
  # under review, which is what a migration branch needs — and it is why no
  # branch name has to be listed here at all.
  #
  # `feat/theme-storage-abstraction` was listed until it merged and was deleted.
  # The entry could then never match again, and it stayed in the file anyway: a
  # branch name in this list is a selector that expires the moment its work is
  # done, and expires without saying so. That is the whole argument for a pull
  # request over adding a branch here — a pull request already means "a branch
  # under review", so the general rule covers the specific case, and there is
  # nothing left to go stale.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These run on separate runners so the test suite cannot consume Build's budget.
  validate-typecheck:
    name: Validation typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # A source scan, so it belongs with the other static checks rather than
      # with the end-to-end job: it protects every pull request, including the
      # ones that never run a browser.
      - name: Check end-to-end assertions
        run: pnpm check:e2e-assertions

      # Migrations are the other place Drizzle's column types do not reach.
      - name: Check migration timestamps
        run: pnpm check:sql-timestamps

  validate-test:
    name: Validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Astro toolchain the Sandbox image installs, from the same lockfile,
      # so the Astro prerender build tests run against what a build container
      # runs. Without it those tests fail in CI rather than skip.
      - name: Install the Astro toolchain
        run: pnpm toolchain:astro

      # Vitest starts the files it has timings for longest first, and files it
      # has none for largest first. Every run here starts from a fresh install,
      # so until now every run was ordered by size, which is how a 142 s file
      # came to start last in its group. This keeps Vitest's own timings file
      # from one successful run to the next. Only the order changes: with no
      # timings restored, or stale ones, every file still runs.
      - name: Restore Vitest's file timings
        uses: actions/cache@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-file-timings-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vitest-file-timings-${{ runner.os }}-

      # The same suite has taken 606 to 1166 s in this job, every phase
      # scaling together, and the log did not say what it ran on.
      - name: Record the runner
        run: node scripts/print-test-runner.mjs

      - name: Test
        run: pnpm test

  validate-build:
    name: Validation build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # Keep the existing check name, and reject every result except success.
  validate:
    name: Typecheck, test, build
    needs: [validate-typecheck, validate-test, validate-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require all validation jobs to succeed
        env:
          TYPECHECK_RESULT: ${{ needs.validate-typecheck.result }}
          TEST_RESULT: ${{ needs.validate-test.result }}
          BUILD_RESULT: ${{ needs.validate-build.result }}
        run: |
          test "$TYPECHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success

  # Architecture guards report independently, so a guard failure still leaves
  # typecheck, test and build evidence available for the same commit.
  architecture-guards:
    # This string is not only a label. GitHub keeps a second copy of it, in
    # branch protection on `main`, as the required status check context
    # (`required_status_checks.contexts`), and nothing keeps the two copies in
    # step. Renaming this line alone does not fail loudly: the check simply
    # stops being reported, every pull request waits on it forever, and —
    # because `enforce_admins` is on — the only way out is Settings -> Branches.
    # Rename both in the same sitting, or neither.
    name: Architecture guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two commands in one script: the scanner's own tests run first, so a
      # scanner that has stopped telling the shapes apart fails as itself rather
      # than reporting a clean repo. An empty result and compliance look the same
      # from outside.
      - name: Check LIKE is spelled in one module
        run: pnpm check:like-tokens

      # `pnpm ship` decides whether a pull request may merge, so its gate belongs
      # with the other rules rather than only on the machine that runs it. It is
      # a pure function over a check rollup; the script itself is not exercised
      # here, and nothing in CI ships anything.
      - name: Check the ship gate
        run: |
          node --test scripts/ci-workflow.test.mjs
          pnpm check:ship

      # `pnpm run deploy` refuses while the remote D1 database and `drizzle/`
      # disagree. That reads a database, so CI runs the rule's tests and the
      # half needing none: migration files numbered without repeats.
      - name: Check migrations
        run: pnpm check:migrations

      # Generators run before every typecheck, build and test; writing an
      # unchanged file there reloads a running dev server for nothing.
      - name: Check generated files are only rewritten when they change
        run: pnpm check:generated-writes

      # A hidden section's values must not reach the preview page, and the
      # editor decides that where it builds the two content messages. A
      # second place building either would post past that check.
      - name: Check preview content messages have one poster each
        run: pnpm check:preview-message-posters

      # The runner the e2e job depends on, against a fake dev server that writes
      # more than a pipe holds while the suite runs. A runner that stops reading
      # it freezes the dev server, and the suite then fails on whatever it was
      # waiting for. Needs no container, database or browser.
      - name: Check the e2e runner keeps reading the dev server
        run: pnpm check:e2e-runner

      # The SDK (`packages/morph-sdk`) builds from its own config, imports
      # nothing outside itself but declared dependencies, and bundles for a
      # browser, a worker and Node. The checker's own tests run first. A step
      # here rather than a job of its own: job names are a required-checks
      # contract.
      - name: Check the SDK ships as its own package
        run: pnpm check:sdk-package

      - name: Check balanced shards cover the complete collected suite
        run: |
          node --test scripts/check-e2e-shards.test.mjs
          node scripts/check-e2e-shards.mjs

      # Every spec gated on the full Start preview is run by the full Start
      # job or excluded with a reason, and that job is wired to turn the
      # runtime on and to refuse a skipped Start test.
      - name: Check the full Start preview plan
        run: |
          node --test scripts/check-e2e-start.test.mjs
          node scripts/check-e2e-start.mjs

  editor-e2e-local-preview:
    name: Editor E2E shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner reads its Ubuntu sources through /etc/apt/apt-mirrors.txt,
      # azure.archive.ubuntu.com first. From 10-22, about one Chromium install
      # in eight sat on that mirror for four to fifteen minutes, and on 10-27
      # one stalled shard failed each of #300 and #302. Probing runners
      # (branch diag/apt-source-probe) put every stalled download on two Azure
      # mirror addresses, while https://archive.ubuntu.com fetched the same
      # package files, checksum for checksum, every time. So only the order of
      # mirrors changes: suites, components and the Signed-By keyring stay the
      # runner's own, and the install below keeps its timeouts and retries.
      - name: Use the primary Ubuntu archive for apt
        run: |
          grep -qx 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources || {
            echo "::error::The runner's Ubuntu sources no longer read /etc/apt/apt-mirrors.txt; this step would change nothing."
            exit 1
          }
          printf '%s\tpriority:%s\n' https://archive.ubuntu.com/ubuntu/ 1 https://security.ubuntu.com/ubuntu/ 2 \
            | sudo tee /etc/apt/apt-mirrors.txt

      # Twice in one night (PR #144) this step sat on an Ubuntu mirror until
      # the job's 30 minutes ran out, before a single test had run. apt then
      # times out each connection instead of waiting forever, and an attempt
      # that times out, or fails to reach a package source, is tried again,
      # up to three times. Any other failure, and a third failed attempt,
      # still fails the job. Only installation is retried here; nothing that
      # tests anything is.
      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          set -o pipefail
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network-timeouts > /dev/null
          transient='Temporary failure resolving|Could not connect|Connection timed out|Failed to fetch|Unable to connect|Could not resolve|ETIMEDOUT|ECONNRESET|socket hang up|Could not get lock|Unable to acquire the dpkg frontend lock'
          for attempt in 1 2 3; do
            install_log=$(mktemp "/tmp/playwright-install-${attempt}-XXXXXX.log")
            log_dev_ino=$(stat -L -c "%d:%i" "$install_log" 2>/dev/null || true)
            status=0
            # Install Chromium and its OS dependencies with an attempt-scoped process group, unique log redirection, and bounded kill-after.
            # Avoid direct pipe to tee which holds stdout open if child apt processes linger.
            setsid timeout --kill-after=15s 240 pnpm exec playwright install --with-deps chromium > "$install_log" 2>&1 &
            install_pid=$!
            wait "$install_pid" || status=$?
            cat "$install_log"
            if [ "$status" -eq 0 ]; then
              rm -f "$install_log"
              exit 0
            fi
            if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && ! grep -Eq "$transient" "$install_log"; then
              echo "::error::Chromium install failed with a non-network error (exit $status); not retrying."
              rm -f "$install_log"
              exit "$status"
            fi
            echo "::warning::Chromium install attempt $attempt failed with a network error or timed out (exit $status)."
            # Terminate this installation attempt's process group, lock-holding descendants, and lingering log writers.
            sudo -n kill -9 -- -"$install_pid" 2>/dev/null || kill -9 -- -"$install_pid" 2>/dev/null || true
            is_attempt_descendant() {
              local p=$1
              [ -d "/proc/$p" ] || return 1
              local pgid
              pgid=$(awk '{print $5}' "/proc/$p/stat" 2>/dev/null || true)
              if [ -n "$pgid" ] && [ "$pgid" = "$install_pid" ]; then
                return 0
              fi
              [ -n "$log_dev_ino" ] || return 1
              for fd_name in $(sudo -n ls "/proc/$p/fd" 2>/dev/null || ls "/proc/$p/fd" 2>/dev/null || true); do
                local fd_dev_ino
                fd_dev_ino=$(sudo -n stat -L -c "%d:%i" "/proc/$p/fd/$fd_name" 2>/dev/null || stat -L -c "%d:%i" "/proc/$p/fd/$fd_name" 2>/dev/null || true)
                if [ -n "$fd_dev_ino" ] && [ "$fd_dev_ino" = "$log_dev_ino" ]; then
                  local flags
                  flags=$(sudo -n awk '/flags:/ {print $2}' "/proc/$p/fdinfo/$fd_name" 2>/dev/null || awk '/flags:/ {print $2}' "/proc/$p/fdinfo/$fd_name" 2>/dev/null || true)
                  if [ -n "$flags" ] && [ $(( flags & 3 )) -ne 0 ]; then
                    return 0
                  fi
                fi
              done
              return 1
            }
            for lock_file in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock; do
              [ -f "$lock_file" ] || continue
              for lock_pid in $(sudo -n fuser "$lock_file" 2>/dev/null || fuser "$lock_file" 2>/dev/null || true); do
                if is_attempt_descendant "$lock_pid"; then
                  echo "::warning::Terminating lock-holding attempt descendant $lock_pid holding $lock_file"
                  sudo -n kill -9 "$lock_pid" 2>/dev/null || kill -9 "$lock_pid" 2>/dev/null || true
                else
                  echo "::warning::Unconfirmed lock holder $lock_pid on $lock_file (not verified attempt writer); skipping termination."
                fi
              done
            done
            for log_pid in $(sudo -n fuser "$install_log" 2>/dev/null || fuser "$install_log" 2>/dev/null || true); do
              if is_attempt_descendant "$log_pid"; then
                sudo -n kill -9 "$log_pid" 2>/dev/null || kill -9 "$log_pid" 2>/dev/null || true
              else
                echo "::warning::Unconfirmed or read-only process $log_pid holding log; skipping termination."
              fi
            done
            rm -f "$install_log"
            if ! dpkg_output=$(sudo -n timeout --kill-after=5s 30 dpkg --configure -a 2>&1); then
              echo "::warning::dpkg --configure -a recovery failed: $dpkg_output"
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Chromium install failed after 3 attempts (last exit $status)."
          exit "$status"

      # Nothing here is a secret. The database is created empty for this run
      # and deleted after it, the account exists only inside it, and the ids
      # are the ones provisioning always writes: `DEFAULT_STOREFRONT_ID` and
      # `DEFAULT_STOREFRONT_THEME_ID` in `storefront.dal.ts`. A repository
      # secret would suggest these values matter somewhere else, and they do
      # not. The template is `DEFAULT_HOME_TEMPLATE_ID` from the same file. The
      # sidecar token is generated per run because it is a shared secret
      # between two processes on this machine and nothing else.
      - name: Write the run's environment
        run: |
          cat > .env.e2e <<EOF
          E2E_EMAIL=editor-e2e@morph.invalid
          E2E_PASSWORD=$(openssl rand -hex 24)
          E2E_EDITOR_PATH=/store/00000000-0000-4000-8000-000000000002/themes/00000000-0000-4000-8000-000000000003/editor?templateId=00000000-0000-4000-8000-000000000004
          EOF
          cat > .dev.vars.local_preview_e2e <<EOF
          MORPH_LOCAL_THEME_PREVIEW_ORIGIN=http://127.0.0.1:5199
          MORPH_LOCAL_THEME_PREVIEW_TOKEN=$(openssl rand -hex 32)
          EOF

      # No Docker and no container image: the `local_preview_e2e` Wrangler
      # environment deliberately omits `containers` and `durable_objects`, so
      # the preview is served by the loopback sidecar. The run asserts that as
      # a precondition rather than trusting it.
      - name: Editor end-to-end
        env:
          MORPH_E2E_AUTH_DIAGNOSTICS: "1"
          MORPH_E2E_REPORT_PATH: test-results/shard-${{ matrix.shard }}.json
        run: pnpm test:e2e:local-preview -- --shard=${{ matrix.shard }}/6

      # One name per attempt: re-running a failed shard keeps the run's earlier
      # artifacts, and the acceptance job reads each shard's latest attempt
      # (latestShardReports in scripts/check-e2e-shards.mjs).
      - name: Upload shard results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  # Preserve the existing check name and refuse skipped/cancelled/failed
  # matrices. A green shard is not evidence that the others ran.
  editor-e2e-acceptance:
    name: Editor end-to-end (local preview transport)
    needs: editor-e2e-local-preview
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.editor-e2e-local-preview.result }}
        run: test "$SHARD_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: editor-e2e-results-*
          path: shard-artifacts

      - name: Check shard guard and complete executed coverage
        run: |
          node --test scripts/check-e2e-shards.test.mjs
          node scripts/check-e2e-shards.mjs shard-artifacts

  # The specs gated on the full TanStack Start preview, which skip on every
  # shard above because the shards run the default client-only preview. Same
  # local sidecar transport and environment as the shards, with the Start
  # runtime turned on in both places it is read: the Worker's
  # `.dev.vars.local_preview_e2e` and the specs' `MORPH_E2E_PREVIEW_RUNTIME`.
  # The file list and its exclusions live in scripts/editor-e2e-start.mjs;
  # Architecture guards checks this job against it.
  editor-e2e-full-start:
    name: Editor E2E full Start shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same apt source as the shards'.
      - name: Use the primary Ubuntu archive for apt
        run: |
          grep -qx 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources || {
            echo "::error::The runner's Ubuntu sources no longer read /etc/apt/apt-mirrors.txt; this step would change nothing."
            exit 1
          }
          printf '%s\tpriority:%s\n' https://archive.ubuntu.com/ubuntu/ 1 https://security.ubuntu.com/ubuntu/ 2 \
            | sudo tee /etc/apt/apt-mirrors.txt

      # The same installation, with the same retry rule, as the shards'.
      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          set -o pipefail
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network-timeouts > /dev/null
          transient='Temporary failure resolving|Could not connect|Connection timed out|Failed to fetch|Unable to connect|Could not resolve|ETIMEDOUT|ECONNRESET|socket hang up|Could not get lock|Unable to acquire the dpkg frontend lock'
          for attempt in 1 2 3; do
            install_log=$(mktemp "/tmp/playwright-install-${attempt}-XXXXXX.log")
            log_dev_ino=$(stat -L -c "%d:%i" "$install_log" 2>/dev/null || true)
            status=0
            # Install Chromium and its OS dependencies with an attempt-scoped process group, unique log redirection, and bounded kill-after.
            # Avoid direct pipe to tee which holds stdout open if child apt processes linger.
            setsid timeout --kill-after=15s 240 pnpm exec playwright install --with-deps chromium > "$install_log" 2>&1 &
            install_pid=$!
            wait "$install_pid" || status=$?
            cat "$install_log"
            if [ "$status" -eq 0 ]; then
              rm -f "$install_log"
              exit 0
            fi
            if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && ! grep -Eq "$transient" "$install_log"; then
              echo "::error::Chromium install failed with a non-network error (exit $status); not retrying."
              rm -f "$install_log"
              exit "$status"
            fi
            echo "::warning::Chromium install attempt $attempt failed with a network error or timed out (exit $status)."
            # Terminate this installation attempt's process group, lock-holding descendants, and lingering log writers.
            sudo -n kill -9 -- -"$install_pid" 2>/dev/null || kill -9 -- -"$install_pid" 2>/dev/null || true
            is_attempt_descendant() {
              local p=$1
              [ -d "/proc/$p" ] || return 1
              local pgid
              pgid=$(awk '{print $5}' "/proc/$p/stat" 2>/dev/null || true)
              if [ -n "$pgid" ] && [ "$pgid" = "$install_pid" ]; then
                return 0
              fi
              [ -n "$log_dev_ino" ] || return 1
              for fd_name in $(sudo -n ls "/proc/$p/fd" 2>/dev/null || ls "/proc/$p/fd" 2>/dev/null || true); do
                local fd_dev_ino
                fd_dev_ino=$(sudo -n stat -L -c "%d:%i" "/proc/$p/fd/$fd_name" 2>/dev/null || stat -L -c "%d:%i" "/proc/$p/fd/$fd_name" 2>/dev/null || true)
                if [ -n "$fd_dev_ino" ] && [ "$fd_dev_ino" = "$log_dev_ino" ]; then
                  local flags
                  flags=$(sudo -n awk '/flags:/ {print $2}' "/proc/$p/fdinfo/$fd_name" 2>/dev/null || awk '/flags:/ {print $2}' "/proc/$p/fdinfo/$fd_name" 2>/dev/null || true)
                  if [ -n "$flags" ] && [ $(( flags & 3 )) -ne 0 ]; then
                    return 0
                  fi
                fi
              done
              return 1
            }
            for lock_file in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock; do
              [ -f "$lock_file" ] || continue
              for lock_pid in $(sudo -n fuser "$lock_file" 2>/dev/null || fuser "$lock_file" 2>/dev/null || true); do
                if is_attempt_descendant "$lock_pid"; then
                  echo "::warning::Terminating lock-holding attempt descendant $lock_pid holding $lock_file"
                  sudo -n kill -9 "$lock_pid" 2>/dev/null || kill -9 "$lock_pid" 2>/dev/null || true
                else
                  echo "::warning::Unconfirmed lock holder $lock_pid on $lock_file (not verified attempt writer); skipping termination."
                fi
              done
            done
            for log_pid in $(sudo -n fuser "$install_log" 2>/dev/null || fuser "$install_log" 2>/dev/null || true); do
              if is_attempt_descendant "$log_pid"; then
                sudo -n kill -9 "$log_pid" 2>/dev/null || kill -9 "$log_pid" 2>/dev/null || true
              else
                echo "::warning::Unconfirmed or read-only process $log_pid holding log; skipping termination."
              fi
            done
            rm -f "$install_log"
            if ! dpkg_output=$(sudo -n timeout --kill-after=5s 30 dpkg --configure -a 2>&1); then
              echo "::warning::dpkg --configure -a recovery failed: $dpkg_output"
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Chromium install failed after 3 attempts (last exit $status)."
          exit "$status"

      # The shards' environment (see "Write the run's environment" above),
      # plus the Worker variable that selects the full Start preview.
      - name: Write the run's environment
        run: |
          cat > .env.e2e <<EOF
          E2E_EMAIL=editor-e2e@morph.invalid
          E2E_PASSWORD=$(openssl rand -hex 24)
          E2E_EDITOR_PATH=/store/00000000-0000-4000-8000-000000000002/themes/00000000-0000-4000-8000-000000000003/editor?templateId=00000000-0000-4000-8000-000000000004
          EOF
          cat > .dev.vars.local_preview_e2e <<EOF
          MORPH_LOCAL_THEME_PREVIEW_ORIGIN=http://127.0.0.1:5199
          MORPH_LOCAL_THEME_PREVIEW_TOKEN=$(openssl rand -hex 32)
          MORPH_THEME_PREVIEW_RUNTIME=start
          EOF

      - name: Editor end-to-end, full Start preview
        env:
          MORPH_E2E_AUTH_DIAGNOSTICS: "1"
          MORPH_E2E_PREVIEW_RUNTIME: start
          MORPH_E2E_REPORT_PATH: test-results/full-start-${{ matrix.shard }}.json
        run: node scripts/run-start-preview-shard.mjs ${{ matrix.shard }}

      # Playwright passes a run whose tests skipped themselves, and every
      # Start test skips when the runtime did not reach it. Only the listed
      # by-design skips may skip; anything else fails the job.
      - name: Require every Start test to have run
        run: node scripts/check-e2e-start.mjs test-results/full-start-${{ matrix.shard }}.json ${{ matrix.shard }}

      # Not under `editor-e2e-results-*`: the acceptance job downloads that
      # pattern and reads it as shard reports.
      - name: Upload results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-full-start-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  # Keep the established required check: it is green only after both full
  # Start shards succeeded and their latest-attempt reports passed inspection.
  editor-e2e-full-start-acceptance:
    name: Editor E2E full Start preview
    needs: editor-e2e-full-start
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every Start shard to succeed
        env:
          SHARD_RESULT: ${{ needs.editor-e2e-full-start.result }}
        run: test "$SHARD_RESULT" = success

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Start shard results
        uses: actions/download-artifact@v4
        with:
          pattern: editor-e2e-full-start-*-attempt-*
          path: start-shard-artifacts

      - name: Verify complete full Start reports
        run: node scripts/check-e2e-start.mjs start-shard-artifacts

  # M1 container lifecycle acceptance: runs in a real Cloudflare Sandbox
  # environment (Docker container) under the full Start runtime.
  # Executes e2e/m1-container-lifecycle-acceptance.spec.ts and verifies
  # that the target test passed with zero skip and zero retry.
  editor-e2e-container:
    name: Editor E2E container lifecycle acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same apt source as the shards'.
      - name: Use the primary Ubuntu archive for apt
        run: |
          grep -qx 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources || {
            echo "::error::The runner's Ubuntu sources no longer read /etc/apt/apt-mirrors.txt; this step would change nothing."
            exit 1
          }
          printf '%s\tpriority:%s\n' https://archive.ubuntu.com/ubuntu/ 1 https://security.ubuntu.com/ubuntu/ 2 \
            | sudo tee /etc/apt/apt-mirrors.txt

      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          set -o pipefail
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network-timeouts > /dev/null
          transient='Temporary failure resolving|Could not connect|Connection timed out|Failed to fetch|Unable to connect|Could not resolve|ETIMEDOUT|ECONNRESET|socket hang up|Could not get lock|Unable to acquire the dpkg frontend lock'
          for attempt in 1 2 3; do
            install_log=$(mktemp "/tmp/playwright-install-${attempt}-XXXXXX.log")
            log_dev_ino=$(stat -L -c "%d:%i" "$install_log" 2>/dev/null || true)
            status=0
            # Install Chromium and its OS dependencies with an attempt-scoped process group, unique log redirection, and bounded kill-after.
            # Avoid direct pipe to tee which holds stdout open if child apt processes linger.
            setsid timeout --kill-after=15s 240 pnpm exec playwright install --with-deps chromium > "$install_log" 2>&1 &
            install_pid=$!
            wait "$install_pid" || status=$?
            cat "$install_log"
            if [ "$status" -eq 0 ]; then
              rm -f "$install_log"
              exit 0
            fi
            if [ "$status" -ne 124 ] && [ "$status" -ne 137 ] && ! grep -Eq "$transient" "$install_log"; then
              echo "::error::Chromium install failed with a non-network error (exit $status); not retrying."
              rm -f "$install_log"
              exit "$status"
            fi
            echo "::warning::Chromium install attempt $attempt failed with a network error or timed out (exit $status)."
            # Terminate this installation attempt's process group, lock-holding descendants, and lingering log writers.
            sudo -n kill -9 -- -"$install_pid" 2>/dev/null || kill -9 -- -"$install_pid" 2>/dev/null || true
            is_attempt_descendant() {
              local p=$1
              [ -d "/proc/$p" ] || return 1
              local pgid
              pgid=$(awk '{print $5}' "/proc/$p/stat" 2>/dev/null || true)
              if [ -n "$pgid" ] && [ "$pgid" = "$install_pid" ]; then
                return 0
              fi
              [ -n "$log_dev_ino" ] || return 1
              for fd_name in $(sudo -n ls "/proc/$p/fd" 2>/dev/null || ls "/proc/$p/fd" 2>/dev/null || true); do
                local fd_dev_ino
                fd_dev_ino=$(sudo -n stat -L -c "%d:%i" "/proc/$p/fd/$fd_name" 2>/dev/null || stat -L -c "%d:%i" "/proc/$p/fd/$fd_name" 2>/dev/null || true)
                if [ -n "$fd_dev_ino" ] && [ "$fd_dev_ino" = "$log_dev_ino" ]; then
                  local flags
                  flags=$(sudo -n awk '/flags:/ {print $2}' "/proc/$p/fdinfo/$fd_name" 2>/dev/null || awk '/flags:/ {print $2}' "/proc/$p/fdinfo/$fd_name" 2>/dev/null || true)
                  if [ -n "$flags" ] && [ $(( flags & 3 )) -ne 0 ]; then
                    return 0
                  fi
                fi
              done
              return 1
            }
            for lock_file in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock; do
              [ -f "$lock_file" ] || continue
              for lock_pid in $(sudo -n fuser "$lock_file" 2>/dev/null || fuser "$lock_file" 2>/dev/null || true); do
                if is_attempt_descendant "$lock_pid"; then
                  echo "::warning::Terminating lock-holding attempt descendant $lock_pid holding $lock_file"
                  sudo -n kill -9 "$lock_pid" 2>/dev/null || kill -9 "$lock_pid" 2>/dev/null || true
                else
                  echo "::warning::Unconfirmed lock holder $lock_pid on $lock_file (not verified attempt writer); skipping termination."
                fi
              done
            done
            for log_pid in $(sudo -n fuser "$install_log" 2>/dev/null || fuser "$install_log" 2>/dev/null || true); do
              if is_attempt_descendant "$log_pid"; then
                sudo -n kill -9 "$log_pid" 2>/dev/null || kill -9 "$log_pid" 2>/dev/null || true
              else
                echo "::warning::Unconfirmed or read-only process $log_pid holding log; skipping termination."
              fi
            done
            rm -f "$install_log"
            if ! dpkg_output=$(sudo -n timeout --kill-after=5s 30 dpkg --configure -a 2>&1); then
              echo "::warning::dpkg --configure -a recovery failed: $dpkg_output"
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Chromium install failed after 3 attempts (last exit $status)."
          exit "$status"

      - name: Write the run's environment
        run: |
          cat > .env.e2e <<EOF
          E2E_EMAIL=editor-e2e@morph.invalid
          E2E_PASSWORD=$(openssl rand -hex 24)
          E2E_EDITOR_PATH=/store/00000000-0000-4000-8000-000000000002/themes/00000000-0000-4000-8000-000000000003/editor?templateId=00000000-0000-4000-8000-000000000004
          EOF
          cat > .dev.vars <<EOF
          MORPH_THEME_PREVIEW_RUNTIME=start
          MORPH_LOCAL_THEME_ORIGIN=http://127.0.0.1:8799
          MORPH_ALLOW_LOCAL_DOMAIN_PROVISIONING=true
          MORPH_PREVIEW_REQUEST_TRACE=1
          EOF

      # Diagnostics only (handoff 2026-10-30, closed container-port
      # connections): Docker's container and network events, and the preview
      # containers' own request record that MORPH_PREVIEW_REQUEST_TRACE above
      # turns on, kept with the results. Neither step judges anything: the
      # test's own steps below decide the job, as before.
      - name: Record container diagnostics
        run: |
          nohup node scripts/container-diagnostics.mjs record "$RUNNER_TEMP/container-diagnostics"             > "$RUNNER_TEMP/container-diagnostics.out" 2>&1 &
          for i in $(seq 1 50); do
            grep -q '"ev":"recording"' "$RUNNER_TEMP/container-diagnostics/recorder.ndjson" 2>/dev/null && exit 0
            sleep 0.1
          done
          echo "::warning::Container diagnostics did not start; the run goes on without them."

      - name: Run M1 container lifecycle acceptance
        env:
          MORPH_E2E_AUTH_DIAGNOSTICS: "1"
          MORPH_E2E_TRANSPORT: cloudflare-sandbox
          MORPH_E2E_PREVIEW_RUNTIME: start
          MORPH_THEME_PREVIEW_RUNTIME: start
          MORPH_E2E_REPORT_PATH: test-results/container-acceptance.json
        run: node scripts/run-editor-e2e.mjs e2e/m1-container-lifecycle-acceptance.spec.ts

      - name: Stop container diagnostics
        if: always()
        run: node scripts/container-diagnostics.mjs stop "$RUNNER_TEMP/container-diagnostics" test-results/container-diagnostics

      - name: Require M1 container acceptance test to have passed with zero skip and zero retry
        run: node scripts/check-container-acceptance.mjs test-results/container-acceptance.json

      - name: Upload results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-container-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
