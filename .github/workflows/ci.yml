name: CI

on:
  # `push` covers the merged state on `main`; `pull_request` covers every branch
  # under review, which is what a migration branch needs — and it is why no
  # branch name has to be listed here at all.
  #
  # `feat/theme-storage-abstraction` was listed until it merged and was deleted.
  # The entry could then never match again, and it stayed in the file anyway: a
  # branch name in this list is a selector that expires the moment its work is
  # done, and expires without saying so. That is the whole argument for a pull
  # request over adding a branch here — a pull request already means "a branch
  # under review", so the general rule covers the specific case, and there is
  # nothing left to go stale.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # A source scan, so it belongs with the other static checks rather than
      # with the end-to-end job: it protects every pull request, including the
      # ones that never run a browser.
      - name: Check end-to-end assertions
        run: pnpm check:e2e-assertions

      # Migrations are the other place Drizzle's column types do not reach.
      - name: Check migration timestamps
        run: pnpm check:sql-timestamps

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Its own job, on purpose, and the reason is mechanical rather than tidiness.
  #
  # A failed *step* makes GitHub Actions skip every step after it, so a guard
  # that can legitimately be red cannot be a step inside `validate`: it would
  # take Test and Build down with it, and those two are the only signals a
  # migration has while it runs. This guard was red for exactly that long, and
  # is green now that the last call site moved. The reason above is about the
  # next migration, not this one — a separate job fails on its own, costs no
  # wall time from the others, and is the unit a branch protection rule can
  # require.
  #
  # The existing static checks are green by nature, which is why this assumption
  # never showed up in their placement.
  architecture-guards:
    # This string is not only a label. GitHub keeps a second copy of it, in
    # branch protection on `main`, as the required status check context
    # (`required_status_checks.contexts`), and nothing keeps the two copies in
    # step. Renaming this line alone does not fail loudly: the check simply
    # stops being reported, every pull request waits on it forever, and —
    # because `enforce_admins` is on — the only way out is Settings -> Branches.
    # Rename both in the same sitting, or neither.
    name: Architecture guards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two commands in one script: the scanner's own tests run first, so a
      # scanner that has stopped telling the shapes apart fails as itself rather
      # than reporting a clean repo. An empty result and compliance look the same
      # from outside.
      - name: Check LIKE is spelled in one module
        run: pnpm check:like-tokens

      # `pnpm ship` decides whether a pull request may merge, so its gate belongs
      # with the other rules rather than only on the machine that runs it. It is
      # a pure function over a check rollup; the script itself is not exercised
      # here, and nothing in CI ships anything.
      - name: Check the ship gate
        run: pnpm check:ship

      # Generators run before every typecheck, build and test; writing an
      # unchanged file there reloads a running dev server for nothing.
      - name: Check generated files are only rewritten when they change
        run: pnpm check:generated-writes

  editor-e2e-local-preview:
    name: Editor end-to-end (local preview transport)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Nothing here is a secret. The database is created empty for this run
      # and deleted after it, the account exists only inside it, and the ids
      # are the ones provisioning always writes: `DEFAULT_STOREFRONT_ID` and
      # `DEFAULT_STOREFRONT_THEME_ID` in `storefront.dal.ts`. A repository
      # secret would suggest these values matter somewhere else, and they do
      # not. The template is `DEFAULT_HOME_TEMPLATE_ID` from the same file. The
      # sidecar token is generated per run because it is a shared secret
      # between two processes on this machine and nothing else.
      - name: Write the run's environment
        run: |
          cat > .env.e2e <<EOF
          E2E_EMAIL=editor-e2e@morph.invalid
          E2E_PASSWORD=$(openssl rand -hex 24)
          E2E_EDITOR_PATH=/store/00000000-0000-4000-8000-000000000002/themes/00000000-0000-4000-8000-000000000003/editor?templateId=00000000-0000-4000-8000-000000000004
          EOF
          cat > .dev.vars.local_preview_e2e <<EOF
          MORPH_LOCAL_THEME_PREVIEW_ORIGIN=http://127.0.0.1:5199
          MORPH_LOCAL_THEME_PREVIEW_TOKEN=$(openssl rand -hex 32)
          EOF

      # No Docker and no container image: the `local_preview_e2e` Wrangler
      # environment deliberately omits `containers` and `durable_objects`, so
      # the preview is served by the loopback sidecar. The run asserts that as
      # a precondition rather than trusting it.
      - name: Editor end-to-end
        run: pnpm test:e2e:local-preview

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
